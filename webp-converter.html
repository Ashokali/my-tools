<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebP Forge — Image Converter</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <!-- Navbar styles & fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>

<body class="page-webp-converter">

  <!-- Custom AK Navbar -->
  <nav class="ak-navbar">
    <div class="container">
      <div class="ak-navbar-flex">
        <a href="index.html" class="brand-new" style="gap: 12px; margin: 0; padding: 0; text-decoration: none;">
          <img src="assets/favicon.svg" alt="Icon" class="brand-logo-img">
          <div class="brand-text-wrap">
            <span class="brand-ash">Ash</span>
            <span class="brand-tools">Tools</span>
          </div>
        </a>
        <div class="ak-nav-badge">
          WEBP CONVERTER
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <header>

      <h1>Convert to <span>WebP</span></h1>
      <p class="subtitle">// drop images · choose format · download converted files</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">Drop your images here</div>
      <p class="drop-sub">or <span onclick="document.getElementById('fileInput').click()">browse files</span> — JPG,
        PNG, GIF, BMP, TIFF, AVIF</p>
      <input type="file" id="fileInput" multiple accept="image/*">
    </div>

    <div class="settings-panel">
      <div class="settings-title">// Conversion Settings</div>
      <div class="settings-grid">
        <div class="setting-item">
          <label>Output Format</label>
          <select id="outputFormat">
            <option value="webp">WebP</option>
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Quality — <span id="qualityLabel">60</span>%</label>
          <div class="range-wrapper">
            <input type="range" id="quality" min="1" max="100" value="60">
            <span class="range-val" id="qualityVal">60</span>
          </div>
        </div>
        <div class="setting-item">
          <label>Max Width (px, 0 = original)</label>
          <input type="number" id="maxWidth" value="0" min="0" step="100"
            style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:'DM Mono',monospace;font-size:13px;outline:none;width:100%;transition:border-color 0.2s"
            onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <div class="setting-item">
          <label>Max Height (px, 0 = original)</label>
          <input type="number" id="maxHeight" value="0" min="0" step="100"
            style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:'DM Mono',monospace;font-size:13px;outline:none;width:100%;transition:border-color 0.2s"
            onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
        </div>
      </div>
    </div>

    <div class="queue" id="queue"></div>

    <div class="action-bar">
      <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
      <button class="btn btn-primary" id="convertBtn" onclick="convertAll()" disabled>Convert All</button>
      <button class="btn btn-dl-all" id="dlAllBtn" onclick="downloadAll()" style="display:none">↓ Download All</button>
    </div>

    <div class="summary" id="summary">
      <p style="font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:8px;">✓ Conversion Complete
      </p>
      <div class="summary-stats">
        <div>
          <div class="summary-stat" id="statFiles">0</div>
          <div class="summary-label">Files Converted</div>
        </div>
        <div>
          <div class="summary-stat" id="statSaved">0%</div>
          <div class="summary-label">Avg Size Saved</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>


  <script src="assets/js/script.js"></script>
</body>

</html>
