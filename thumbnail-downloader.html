<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail Downloader | Ash Tools</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { bg: '#080c12', surface: '#0e1520', card: '#111827', border: '#1e2d40' }
                    }
                }
            }
        }
    </script>
    <!-- FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>

<body class="antialiased page-thumbnail-downloader">
    <div class="glow-orb" id="dynamic-glow"></div>

    <!-- Custom AK Navbar -->
    <nav class="ak-navbar">
        <div class="container">
            <div class="ak-navbar-flex">
                <a href="index.html" class="brand-new" style="gap: 12px; margin: 0; padding: 0; text-decoration: none;">
          <img src="assets/favicon.svg" alt="Icon" class="brand-logo-img">
          <div class="brand-text-wrap">
            <span class="brand-ash">Ash</span>
            <span class="brand-tools">Tools</span>
          </div>
        </a>
                <div class="ak-nav-badge" id="nav-badge">
                    THUMBNAIL DOWNLOADER
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5 relative z-10">

        <div class="text-center mb-12">
            <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full border-[1px] border-pink-500/20 bg-pink-500/10 text-pink-400 text-xs font-medium mb-5">
                <i class="fa-brands fa-youtube"></i> YouTube Tool
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold mb-5 tracking-tight"><span class="text-white">Download</span>
                <span class="gradient-text">Thumbnails</span></h1>
            <p class="text-lg text-slate-400 max-w-2xl mx-auto">Extract high-quality thumbnails from any YouTube video
                instantly.</p>
        </div>

        
            <!-- Input Section -->
            <div class="glass-card rounded-2xl p-4 md:p-6 mb-8">
                <div class="relative flex items-center">
                    <div class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 text-lg" id="platform-icon">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <input type="text" id="url-input" placeholder="Paste YouTube link here..."
                        class="w-full bg-slate-900/50 border-[1px] border-slate-700/50 rounded-2xl py-4 pl-12 pr-32 text-white placeholder-slate-500 focus:outline-none focus:border-pink-500/50 focus:ring-1 focus:ring-pink-500/50 transition-all text-base">

                    <button id="fetch-btn"
                        class="absolute right-3 top-1/2 -translate-y-1/2 py-2.5 bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-400 hover:to-pink-500 text-white font-bold px-5 rounded-lg transition-all active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Fetch</span>
                    </button>
                </div>

                <div id="error-msg" class="hidden mt-4 text-red-400 text-sm flex items-center gap-2 px-4">
                    <i class="fa-solid fa-circle-exclamation"></i> <span>Invalid URL. Please check and try again.</span>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="hidden glass-card rounded-3xl p-12 text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-pink-500 mb-4"></i>
                <p class="text-slate-400 font-medium tracking-wide">Extracting high-res image...</p>
            </div>

            <!-- Results Section -->
            <div id="result-section" class="hidden glass-card rounded-3xl overflow-hidden flex flex-col md:flex-row">
                <!-- Image Preview -->
                <div
                    class="w-full md:w-3/5 bg-slate-900/80 relative group flex items-center justify-center p-6 border-b md:border-b-0 md:border-r border-slate-700/50 min-h-[300px]">
                    <img id="preview-img" src="" alt="Thumbnail Preview"
                        class="max-w-full max-h-full rounded-xl shadow-2xl transition-transform duration-500 group-hover:scale-[1.02]">
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-6">
                        <button onclick="downloadImage('HD')"
                            class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-all">
                            <i class="fa-solid fa-magnifying-glass-plus"></i> View Full Size
                        </button>
                    </div>
                </div>

                <!-- Download Options -->
                <div class="w-full md:w-2/5 p-6 md:p-8 flex flex-col justify-center bg-slate-800/30">
                    <div class="mb-6">
                        <span
                            class="px-2.5 py-1 rounded-md bg-green-500/10 border-[1px] border-green-500/20 text-xs text-green-400 font-medium inline-flex items-center gap-1 mb-3"><i
                                class="fa-solid fa-check"></i> Found</span>
                        <h3 id="result-title" class="text-xl font-bold text-white mb-1">YouTube Thumbnail</h3>
                        <p id="result-meta" class="text-sm text-slate-400">Select quality to download</p>
                    </div>

                    <div class="space-y-3" id="download-options">
                        <!-- Buttons injected here -->
                    </div>
                </div>
            </div>

    </main>


    <script src="assets/js/script.js"></script>
    
</body>

</html>
